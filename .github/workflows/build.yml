name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build EXE
      run: pyinstaller --onefile Glokk.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Glokk-EXE
        path: dist/Glokk.exe
